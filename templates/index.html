<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing URL Detector</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 520px;
            width: 100%;
        }
        h1 { color: #1e3c72; font-size: 1.6rem; margin-bottom: 8px; }
        .subtitle { color: #666; margin-bottom: 28px; font-size: 0.95rem; }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            margin-bottom: 16px;
            transition: border 0.2s;
        }
        input[type="text"]:focus { outline: none; border-color: #2a5298; }
        button {
            width: 100%;
            padding: 14px;
            background: #2a5298;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #1e3c72; }
        .result {
            margin-top: 28px;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
        }
        .phishing { background: #fdecea; border: 2px solid #e74c3c; }
        .legit { background: #eafaf1; border: 2px solid #27ae60; }
        .verdict { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
        .phishing .verdict { color: #c0392b; }
        .legit .verdict { color: #1e8449; }
        .confidence { color: #555; font-size: 0.95rem; }
        .tested-url {
            word-break: break-all;
            color: #888;
            font-size: 0.85rem;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🛡️ Phishing URL Detector</h1>
        <p class="subtitle">ML-powered detection trained on 549,000 real URLs</p>

        <form method="POST">
            <input type="text" name="url" placeholder="Paste a URL to check..."
                   value="{{ url or '' }}" required>
            <button type="submit">Analyse URL</button>
        </form>

        {% if result %}
        <div class="result {{ 'phishing' if result == 'Phishing' else 'legit' }}">
            <div class="verdict">
                {{ '⚠️ Phishing Detected' if result == 'Phishing' else '✓ Looks Legitimate' }}
            </div>
            <div class="confidence">Confidence: {{ confidence }}%</div>
            <div class="tested-url">Tested: {{ url }}</div>
        </div>
        {% endif %}
    </div>
</body>
</html>
